<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Expense Manager</h1>

        <div class="balance-card">
            <p>Total Balance</p>
            <h2 id="balance">₹0</h2>
        </div>

        <form id="expenseForm">

            <input
                type="text"
                id="title"
                placeholder="Expense name"
            >

            <input
                type="number"
                id="amount"
                placeholder="Amount"
            >

            <button type="submit">
                Add Expense
            </button>

        </form>

        <div class="transactions">
            <h2>Transactions</h2>

            <ul id="expenseList"></ul>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
